# Update Me — Nginx sample (TLS-terminated reverse proxy)
# Copy to /etc/nginx/sites-available/update-me and adjust server_name + certificate paths.
# Do not expose Node ports publicly; proxy only.

upstream update_me_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream update_me_api {
  server 127.0.0.1:5000;
  keepalive 32;
}

# Optional HTTP → HTTPS redirect (enable after certificates exist)
# server {
#   listen 80;
#   listen [::]:80;
#   server_name example.com www.example.com;
#   return 301 https://$host$request_uri;
# }

server {
  listen 80;
  listen [::]:80;
  # After TLS is ready, prefer listening on 443 ssl http2 and keep port 80 as redirect only.
  server_name example.com www.example.com;

  # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  client_max_body_size 2m;

  # Security headers (HSTS only after HTTPS is confirmed)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
  # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  # Content-Security-Policy: start report-only; enforce only after MapLibre + tiles verified.
  # add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; font-src 'self' data:;" always;

  # PWA / service worker — never over-cache the worker
  location = /sw.js {
    proxy_pass http://update_me_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
  }

  location = /manifest.webmanifest {
    proxy_pass http://update_me_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Content-Type application/manifest+json;
  }

  # Long-lived SSE — buffering MUST be off
  location /api/v1/realtime/ {
    proxy_pass http://update_me_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Backend API
  location /api/ {
    proxy_pass http://update_me_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # Next.js frontend (default)
  location / {
    proxy_pass http://update_me_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
